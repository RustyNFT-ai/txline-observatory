name: Observatory smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check source
        run: |
          node --check web/app.js
          python3 -m py_compile server.py normalize.py solana_anchor.py wallet_watch.py jupiter_watch.py
      - name: Exercise recorded-data API
        run: |
          python3 server.py 8901 >/tmp/observatory.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:8901/api/health >/tmp/health.json && break
            sleep 0.25
          done
          python3 - <<'PY'
          import json, os, time, urllib.request
          import server
          base = "http://127.0.0.1:8901"
          health = json.load(urllib.request.urlopen(base + "/api/health"))
          assert health["ok"] and health["matches"] == 47, health
          match = json.load(urllib.request.urlopen(base + "/api/match/england-vs-argentina-2026-07-15"))
          assert match["meta"]["match"] == "England vs Argentina"
          assert len(match["events"]) == 16044
          assert len(match["meta"]["moments"]) == 3
          insights = json.load(urllib.request.urlopen(base + "/api/insights"))
          assert insights["summary"]["opportunities"]["count"] == 154
          scope_match = {"id": "england-vs-argentina-2026-07-15", "match": "England vs Argentina",
                         "date": "2026-07-15", "labels": ["Argentina", "England", "draw"], "moments": []}
          fill = server._wallet_fill({"timestamp": 1784148380, "title": "Will Argentina win on 2026-07-15?",
                                      "outcome": "Yes", "side": "BUY", "price": .135, "size": 10}, scope_match)
          assert fill["team"] == "Argentina"
          address = "0x" + "1" * 40
          server._WALLET_CACHE[address] = (time.time(), {"scope": "test", "matched_fills": 1,
              "matched_matches": 1, "pnl_note": "fills are not P&L", "fills": [fill]})
          context = server.ai_context("england-vs-argentina-2026-07-15", 1, address)
          assert context["selected_public_wallet_evidence"]["fill_count_within_10m"] == 1
          assert len(context["similar_recorded_goal_cases"]) == 5
          assert all(not (x["match_id"] == "england-vs-argentina-2026-07-15" and x["moment_index"] == 1)
                     for x in context["similar_recorded_goal_cases"])
          assert "selected public wallet" in server.fallback_ai(context, "test")["answer"]
          class FakeResponse:
              def __enter__(self): return self
              def __exit__(self, *args): pass
              def read(self, *args):
                  return json.dumps({"model": "gpt-5.6-terra", "output": [
                      {"type": "reasoning", "summary": []},
                      {"type": "message", "content": [
                          {"type": "output_text", "text": "Recorded facts\nProtocol test."}]}],
                      "usage": {"input_tokens": 10, "output_tokens": 4}}).encode()
          seen = {}
          def fake_urlopen(request, timeout=0):
              seen["url"], seen["timeout"] = request.full_url, timeout
              seen["auth"] = request.get_header("Authorization")
              seen["body"] = json.loads(request.data)
              return FakeResponse()
          original_urlopen = server.urllib.request.urlopen
          server.urllib.request.urlopen = fake_urlopen
          os.environ["OPENAI_API_KEY"] = "test-only"
          try:
              answer = server.openai_ai(context, "What happened around this selected goal?")
          finally:
              server.urllib.request.urlopen = original_urlopen
              os.environ.pop("OPENAI_API_KEY", None)
          assert seen["url"].endswith("/v1/responses") and seen["timeout"] == 32
          assert seen["auth"] == "Bearer test-only"
          assert seen["body"]["model"] == "gpt-5.6-terra"
          assert "Trusted archive context" in seen["body"]["input"]
          assert answer["provider"] == "openai" and not answer["fallback"], answer
          PY
